name: A.D V3 / Opportunity Room QA
on:
  push:
    branches:
      - feat/ad-v3-opportunity-room-20261024
  workflow_dispatch:
permissions:
  contents: read
jobs:
  opportunity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Locate Chromium
        shell: bash
        run: |
          BROWSER_PATH="$(find "$HOME/.cache/ms-playwright" -type f \( -name "chrome-headless-shell" -o -name "chrome" \) | grep -E '/(chrome-headless-shell-linux64|chrome-linux64)/' | head -n 1)"
          test -n "$BROWSER_PATH"
          echo "CHROMIUM_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
      - name: Full Radar-to-dossier workflow
        run: npx playwright test tests/browser/opportunity-room.spec.ts tests/browser/ad-v2-design.spec.ts
      - name: Save screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad-v3-opportunity-room-qa
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
