name: A.D CREATE / Browser QA
on:
  push:
    branches:
      - feat/ad-create-canvas-20261024
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canvas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Detect browser binary
        shell: bash
        run: |
          BROWSER_PATH="$(find "$HOME/.cache/ms-playwright" -type f \( -name "chrome-headless-shell" -o -name "chrome" \) | grep -E '/(chrome-headless-shell-linux64|chrome-linux64)/' | head -n 1)"
          test -n "$BROWSER_PATH"
          echo "CHROMIUM_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
      - name: Test Creative Canvas and core projects
        run: npx playwright test tests/browser/creative-canvas.spec.ts tests/browser/workspace.spec.ts
      - name: Keep browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ad-create-canvas-browser-qa
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
